name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    
    - name: Restore
      run: dotnet restore src/Audix/Audix.csproj
    
    - name: Build
      run: dotnet build src/Audix/Audix.csproj -c Release --no-restore
    
    - name: Publish
      run: dotnet publish src/Audix/Audix.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish
    
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: Audix
        path: ./publish/Audix.exe
